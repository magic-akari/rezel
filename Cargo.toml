[workspace]
members = [
	"crates/rezel-common",
	"crates/rezel-generator",
	"crates/rezel-highlight",
	"crates/rezel-lr",
	"languages/go",
	"languages/java",
	"languages/json",
	"languages/python",
	"languages/rust",
	"tools/codegen",
	"tools/references/cpython/stdlib",
	"tools/references/go/stdlib",
	"tools/references/javac/stdlib",
	"tools/references/rustc",
	"tools/source-alignment",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
authors = ["magic-akari <akari.ccino@gmail.com>"]
edition = "2024"
homepage = "https://github.com/magic-akari/rezel"
license = "MIT OR Apache-2.0"
repository = "https://github.com/magic-akari/rezel"

[workspace.dependencies]
prettyplease = "0.2.37"
proc-macro2 = "1.0.106"
quote = "1.0.45"
rezel-common = { version = "0.0.0", path = "crates/rezel-common" }
rezel-generator = { version = "0.0.0", path = "crates/rezel-generator" }
rezel-highlight = { version = "0.0.0", path = "crates/rezel-highlight" }
rezel-lr = { version = "0.0.0", path = "crates/rezel-lr" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
syn = "2.0.117"
text-size = "1.1.1"
toml = "1.1.2"
unicode-normalization = "=0.1.24"
unicode_names2 = "=2.0.0"
zerocopy = { version = "0.8.50", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
