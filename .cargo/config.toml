[alias]
alignment = "run --locked --package rezel-source-alignment --"
doc-all = "doc --locked --workspace --all-features --no-deps"
lint-all = "clippy --locked --workspace --all-targets --all-features -- -D warnings"
rezel = "run --profile generator-dev --locked --package rezel-generator --"
rezel-codegen = "run --profile generator-dev --locked --package rezel-codegen --"
test-all = "test --locked --workspace --all-targets --all-features"
test-doc = "test --locked --workspace --all-features --doc"
test-json-full = "test --locked --package rezel-lang-json --test conformance deep_json_test_suite_cases_are_bounded -- --ignored --exact"

[profile.generator-dev]
inherits = "dev"

[profile.generator-dev.package.rezel-generator]
opt-level = 2
