[tools]
dprint = "0.54.0"
go = "1.26.3"
java = "26.0.1"
node = "26.1.0"
python = "3.14.5"
swift = "6.3.3"

[hooks]
postinstall = [
	'npm ci --prefix "{{config_root}}/tools/source-alignment"',
	'npm ci --prefix "{{config_root}}/tools/references/lezer"',
]

[tasks.alignment]
description = "Verify source-alignment traceability"
run = "cargo alignment verify"

[tasks."codegen:rezel:json"]
description = "Verify checked-in JSON parser sources"
run = "cargo run --locked --package rezel-codegen -- json --check"

[tasks."codegen:rezel:json:update"]
description = "Regenerate checked-in JSON parser sources"
run = "cargo run --locked --package rezel-codegen -- json --update"

[tasks."codegen:rezel:java"]
description = "Verify checked-in Java parser sources"
run = "cargo run --locked --package rezel-codegen -- java --check"

[tasks."codegen:rezel:java:update"]
description = "Regenerate checked-in Java parser sources"
run = "cargo run --locked --package rezel-codegen -- java --update"

[tasks."codegen:rezel:go"]
description = "Verify checked-in Go parser sources"
run = "cargo run --locked --package rezel-codegen -- go --check"

[tasks."codegen:rezel:go:update"]
description = "Regenerate checked-in Go parser sources"
run = "cargo run --locked --package rezel-codegen -- go --update"

[tasks."codegen:rezel:python"]
description = "Verify checked-in Python parser sources"
run = "cargo run --locked --package rezel-codegen -- python --check"

[tasks."codegen:rezel:python:update"]
description = "Regenerate checked-in Python parser sources"
run = "cargo run --locked --package rezel-codegen -- python --update"

[tasks."codegen:rezel:rust"]
description = "Verify checked-in Rust parser sources"
run = "cargo run --locked --package rezel-codegen -- rust --check"

[tasks."codegen:rezel:rust:update"]
description = "Regenerate checked-in Rust parser sources"
run = "cargo run --locked --package rezel-codegen -- rust --update"

[tasks."codegen:rezel:swift"]
description = "Verify checked-in Swift parser sources"
run = "cargo run --locked --package rezel-codegen -- swift --check"

[tasks."codegen:rezel:swift:update"]
description = "Regenerate checked-in Swift parser sources"
run = "cargo run --locked --package rezel-codegen -- swift --update"

[tasks."codegen:rezel:fixtures"]
description = "Verify checked-in rezel-generator test fixtures"
run = "cargo run --locked --package rezel-codegen -- fixtures --check"

[tasks."codegen:rezel:fixtures:update"]
description = "Regenerate checked-in rezel-generator test fixtures"
run = "cargo run --locked --package rezel-codegen -- fixtures --update"

[tasks."codegen:java-identifiers"]
description = "Verify Java identifier tables"
run = "java tools/references/javac/java/JdkIdentifierTables.java --check languages/java/src/unicode17.rs"

[tasks."codegen:java-identifiers:update"]
description = "Regenerate Java identifier tables"
run = "java tools/references/javac/java/JdkIdentifierTables.java --write languages/java/src/unicode17.rs"

[tasks."codegen:python-unicode"]
description = "Verify Python Unicode 16 identifier tables"
run = "python tools/references/cpython/unicode_tables.py --check languages/python/src/unicode16.rs"

[tasks."codegen:python-unicode:update"]
description = "Regenerate Python Unicode 16 identifier tables"
run = "python tools/references/cpython/unicode_tables.py --write languages/python/src/unicode16.rs"

[tasks."codegen:python-unicode-names"]
description = "Verify Python Unicode 16 formal name aliases"
run = "python tools/references/cpython/unicode_names.py --check languages/python/src/unicode16_names.rs"

[tasks."codegen:python-unicode-names:update"]
description = "Regenerate Python Unicode 16 formal name aliases"
run = "python tools/references/cpython/unicode_names.py --write languages/python/src/unicode16_names.rs"

[tasks."codegen:python-typed"]
description = "Verify the complete Python typed CST schema"
run = "python tools/references/cpython/typed_schema.py --check"

[tasks."codegen:python-typed:update"]
description = "Regenerate the complete Python typed CST schema"
run = "python tools/references/cpython/typed_schema.py --update"

[tasks."codegen:python-ast"]
description = "Verify the CPython-aligned Rust AST schema"
run = "python tools/references/cpython/ast_schema.py --check"

[tasks."codegen:python-ast:update"]
description = "Regenerate the CPython-aligned Rust AST schema"
run = "python tools/references/cpython/ast_schema.py --update"

[tasks.docs]
description = "Build Rust API documentation"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc-all"

[tasks."format:check"]
description = "Check repository formatting"
run = [
	"dprint check --incremental=false",
	"cargo fmt --all --check",
]

[tasks.lint]
description = "Run repository lints"
env = { GOTOOLCHAIN = "local", GOWORK = "off" }
run = [
	"go -C tools/references/go test .",
	"npm --prefix tools/source-alignment run check",
	"npm --prefix tools/references/lezer run typecheck",
	"cargo lint-all",
]

[tasks."reference:go"]
description = "Verify Go parse acceptance and public AST snapshots"
env = { GOTOOLCHAIN = "local", GOWORK = "off" }
run = "go -C tools/references/go run . --check"

[tasks."reference:go:update"]
description = "Regenerate Go parser and public AST snapshots"
env = { GOTOOLCHAIN = "local", GOWORK = "off" }
run = "go -C tools/references/go run . --update"

[tasks."reference:javac"]
description = "Verify Java parse acceptance and compiler-tree snapshots"
run = "java tools/references/javac/java/JavacReference.java --check"

[tasks."reference:javac:update"]
description = "Regenerate Java compiler-tree snapshots"
run = "java tools/references/javac/java/JavacReference.java --update"

[tasks."reference:rustc"]
description = "Verify Rust 1.95 Edition 2024 compiler acceptance snapshots"
run = "cargo run --locked --package rezel-rustc-reference -- --check"

[tasks."reference:rustc:update"]
description = "Regenerate Rust 1.95 Edition 2024 compiler acceptance snapshots"
run = "cargo run --locked --package rezel-rustc-reference -- --update"

[tasks."reference:lezer"]
description = "Verify snapshots from the pinned Lezer reference"
run = "npm --prefix tools/references/lezer run check"

[tasks."reference:lezer:update"]
description = "Regenerate snapshots from the pinned Lezer reference"
run = "npm --prefix tools/references/lezer run update"

[tasks."reference:swift"]
description = "Check Swift fixtures with the mise-pinned official parser oracle"
run = "python tools/references/swift/reference.py"

[tasks."reference:swift:p0:prepare"]
description = "Fetch and materialize pinned official Swift source and parser corpora"
run = "python tools/references/swift/prepare_p0.py"

[tasks."reference:swift:p0"]
description = "Verify the pinned official Swift source and parser corpora"
depends = ["reference:swift:p0:prepare"]
env = { CARGO_TARGET_DIR = "target/swift-p0" }
run = "cargo run --locked --manifest-path tools/references/swift/p0/Cargo.toml --features parser"

[tasks."reference:cpython"]
description = "Verify CPython 3.14 parse and AST snapshots"
run = "python tools/references/cpython/reference.py --check"

[tasks."reference:cpython:update"]
description = "Regenerate CPython 3.14 parse and AST snapshots"
run = "python tools/references/cpython/reference.py --update"

[tasks."reference:stdlib"]
description = "Verify Rezel against standard-library sources"
depends = [
	"reference:stdlib:go",
	"reference:stdlib:java",
	"reference:stdlib:python",
	"reference:stdlib:rust",
]

[tasks."reference:stdlib:go"]
description = "Verify Go standard-library source acceptance"
env = { GOTOOLCHAIN = "local", GOWORK = "off" }
run = "cargo run --locked --package rezel-go-stdlib-reference"

[tasks."reference:stdlib:go:ast"]
description = "Compare all Go standard-library ASTs with go/parser"
env = { GOTOOLCHAIN = "local", GOWORK = "off" }
run = "cargo run --locked --package rezel-go-stdlib-reference -- --ast-oracle"

[tasks."reference:stdlib:java"]
description = "Verify Java standard-library source acceptance and lowering"
run = "cargo run --locked --package rezel-java-stdlib-reference"

[tasks."reference:stdlib:java:ast"]
description = "Compare all Java standard-library ASTs with javac"
run = "cargo run --locked --package rezel-java-stdlib-reference -- --ast-oracle"

[tasks."reference:stdlib:python"]
description = "Verify Python standard-library source acceptance and lowering"
run = "cargo run --locked --package rezel-python-stdlib-reference"

[tasks."reference:stdlib:python:ast"]
description = "Compare all Python standard-library ASTs with CPython"
run = "cargo run --locked --package rezel-python-stdlib-reference -- --ast-oracle"

[tasks."reference:stdlib:rust"]
description = "Verify Rust 1.95 standard-library source acceptance"
run = "cargo run --locked --package rezel-rust-stdlib-reference"

[tasks.test]
description = "Run Rust tests"
run = [
	"cargo test-all",
	"cargo test-doc",
]

[tasks."test:full"]
description = "Run extended test coverage"
run = "cargo test-json-full"

[tasks.verify]
description = "Run the repository verification suite"
depends = [
	"format:check",
	"test",
	"lint",
	"docs",
	"alignment",
	"codegen:rezel:json",
	"codegen:rezel:java",
	"codegen:rezel:go",
	"codegen:rezel:python",
	"codegen:rezel:rust",
	"codegen:rezel:swift",
	"codegen:rezel:fixtures",
	"codegen:java-identifiers",
	"codegen:python-unicode",
	"codegen:python-unicode-names",
	"codegen:python-typed",
	"codegen:python-ast",
]

[tasks."verify:full"]
description = "Run the full repository verification suite"
depends = [
	"verify",
	"test:full",
	"reference:go",
	"reference:javac",
	"reference:rustc",
	"reference:cpython",
	"reference:lezer",
	"reference:stdlib",
]
