[tools]
dprint = "0.54.0"
node = "26.1.0"

[hooks]
postinstall = 'npm ci --prefix "{{config_root}}/tools/source-alignment"'

[tasks.alignment]
description = "Verify source-alignment traceability"
run = "cargo alignment verify"

[tasks."codegen:rezel:json"]
description = "Verify checked-in JSON parser sources"
run = "cargo run --locked --package rezel-codegen -- json --check"

[tasks."codegen:rezel:json:update"]
description = "Regenerate checked-in JSON parser sources"
run = "cargo run --locked --package rezel-codegen -- json --update"

[tasks."codegen:rezel:fixtures"]
description = "Verify checked-in rezel-generator test fixtures"
run = "cargo run --locked --package rezel-codegen -- fixtures --check"

[tasks."codegen:rezel:fixtures:update"]
description = "Regenerate checked-in rezel-generator test fixtures"
run = "cargo run --locked --package rezel-codegen -- fixtures --update"

[tasks.docs]
description = "Build Rust API documentation"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc-all"

[tasks."format:check"]
description = "Check repository formatting"
run = [
	"dprint check --incremental=false",
	"cargo fmt --all --check",
]

[tasks.lint]
description = "Run Rust lints"
run = [
	"npm --prefix tools/source-alignment run check",
	"cargo lint-all",
]

[tasks.test]
description = "Run Rust tests"
run = [
	"cargo test-all",
	"cargo test-doc",
]

[tasks."test:full"]
description = "Run extended test coverage"
run = "cargo test-json-full"

[tasks.verify]
description = "Run the repository verification suite"
depends = [
	"format:check",
	"test",
	"lint",
	"docs",
	"alignment",
	"codegen:rezel:json",
	"codegen:rezel:fixtures",
]

[tasks."verify:full"]
description = "Run the full repository verification suite"
depends = ["verify", "test:full"]
