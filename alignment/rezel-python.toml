schema_version = 1

[component]
name = "rezel-python"
source_root = "languages/python/src"

[upstream]
repository = "https://github.com/lezer-parser/python"
commit = "254ca14c73b3a3db9b6475d33b0c233090b0bb11"

[[snapshot]]
source = "src/highlight.js"
path = "alignment/upstream/python/highlight.json"

[[snapshot]]
source = "src/tokens.js"
path = "alignment/upstream/python/tokens.json"

[[scope]]
rust_file = "generated.rs"
classification = "rezel-owned"
invariant = "The checked parser is regenerated byte-for-byte from the maintained Python grammar and statically binds every external."
representation = "Rezel emits immutable Rust LR tables from the maintained Python 3.14 grammar and checked binding manifest."
evidence_files = [
	"languages/python/grammar/python.grammar",
	"languages/python/grammar/python.bindings.toml",
	"tools/codegen/src/main.rs",
	"languages/python/tests/reference/lezer.rs",
]

[[scope]]
rust_file = "identifier.rs"
classification = "standard-algorithm"
invariant = "Python identifiers use CPython 3.14 Unicode 16 XID_Start and XID_Continue behavior."
representation = "A Unicode code-point scanner bulk-advances identity-mapped ASCII identifier runs, classifies the ASCII alphabet directly, and falls back to deterministic tables generated by the mise-pinned CPython runtime."
evidence_files = [
	"languages/python/tests/contract.rs",
	"languages/python/tests/reference/cpython.rs",
	"languages/python/tests/reference/lezer.rs",
]

[[scope]]
rust_file = "indentation.rs"
classification = "rezel-owned"
invariant = "Strict full-source parsing enforces CPython visual and alternate indentation columns without making the recovering external tokenizer fatal."
representation = "A source preflight separates indentation-level transitions from physical-line lexical state, recognizes LF, CRLF, and CR line endings, and ignores indentation inside strings, bracketed expressions, and explicit continuations."
evidence_files = [
	"languages/python/tests/contract.rs",
	"languages/python/tests/reference/cpython.rs",
	"tools/references/cpython/stdlib/src/main.rs",
]

[[scope]]
rust_file = "lib.rs"
classification = "rezel-owned"
invariant = "The Python facade exposes configurable recovering and strict parsing without fixing future parser implementation details in the public API."
representation = "PythonParser delegates to immutable generated LR tables through the common Parser interface; strict full-source parses add indentation preflight and post-parse syntax validation, while recovery parsing delegates directly to preserve editor trees."
evidence_files = [
	"languages/python/tests/contract.rs",
	"languages/python/tests/reference/cpython.rs",
	"languages/python/tests/reference/lezer.rs",
]

[[scope]]
rust_file = "terms.rs"
classification = "rezel-owned"
invariant = "Named and exported Python grammar terms have deterministic Rust identifiers."
representation = "The Rezel generator emits constants from the maintained grammar."
evidence_files = ["tools/codegen/src/main.rs"]

[[scope]]
rust_file = "tokens.rs"
classification = "adapted"
upstream_file = "src/tokens.js"
upstream_symbols = ["newlines", "indentation", "trackIndent", "strings"]
invariant = "Python newlines, structural indentation contexts, and string modes preserve maintained Lezer CST recovery behavior while excluding Python 2-only print syntax."
representation = "Typed Rust external tokenizers and immutable context values replace JavaScript tokenizers; newline scanning rejects code points outside its possible starting alphabet before backward lookup, and the reduction transition's input-free callback type lets the runtime skip Lezer's unconditional stream reset."
evidence_files = [
	"languages/python/tests/contract.rs",
	"languages/python/tests/reference/cpython.rs",
	"languages/python/tests/reference/lezer.rs",
]

[[scope]]
rust_file = "typed.rs"
classification = "rezel-owned"
invariant = "Generated typed syntax accounts for every visible maintained Python CST kind."
representation = "Checked wrappers implement TypedNode from a complete generated schema."
evidence_files = [
	"languages/python/grammar/python.typed.toml",
	"tools/codegen/src/main.rs",
]

[[scope]]
rust_file = "unicode16.rs"
classification = "standard-algorithm"
invariant = "Checked scalar ranges exactly reproduce CPython 3.14.5 Unicode 16 identifier classification."
representation = "The mise-pinned CPython runtime generates inclusive XID ranges with no runtime Python dependency."
evidence_files = ["tools/references/cpython/unicode_tables.py"]

[[scope]]
rust_file = "unicode16_names.rs"
classification = "standard-algorithm"
invariant = "Checked formal name aliases exactly match Unicode 16 and the mise-pinned CPython 3.14.5 lookup results."
representation = "A generated sorted alias table is derived from the hash-pinned Unicode NameAliases data file."
evidence_files = [
	"tools/references/cpython/data/NameAliases-16.0.0.txt",
	"tools/references/cpython/unicode_names.py",
	"languages/python/tests/reference/cpython.rs",
]

[[scope]]
rust_file = "unicode_names.rs"
classification = "standard-algorithm"
invariant = "Named Unicode escapes accept CPython's case-insensitive exact canonical names, formal aliases, and algorithmic Unicode 16 names without UAX loose-matching extensions."
representation = "The Unicode 16 unicode_names2 perfect hash is strictly revalidated against canonical spelling and a generated formal-alias table."
evidence_files = [
	"tools/references/cpython/unicode_names.py",
	"languages/python/tests/reference/cpython.rs",
]

[[scope]]
rust_file = "syntax/mod.rs"
classification = "rezel-owned"
invariant = "Flattened Python grammar productions expose stable grammatical roles without adding lowering-only nodes to the persistent CST."
representation = "Short-lived typed and source-backed syntax-shape views isolate raw child order, separators, and omitted punctuation from AST lowering."
evidence_files = [
	"languages/python/tests/lowering.rs",
	"languages/python/tests/reference/cpython.rs",
	"languages/python/tests/reference/lezer.rs",
	"languages/python/src/syntax/tests.rs",
]

[[scope]]
rust_file = "syntax/declarations.rs"
classification = "rezel-owned"
invariant = "Function and type-parameter declarations expose async, variance marker, bound, and default roles independently of flattened child positions."
representation = "Ephemeral declaration views classify direct typed children without retaining a second syntax tree."
evidence_files = [
	"languages/python/tests/reference/cpython.rs",
	"languages/python/src/syntax/tests.rs",
]

[[scope]]
rust_file = "syntax/expressions.rs"
classification = "rezel-owned"
invariant = "Operators, call arguments, and dictionary entries have one normalized CST interpretation shared by every AST consumer."
representation = "Linear direct-child adapters classify expression roles and discard layout-only children on demand."
evidence_files = [
	"languages/python/tests/reference/cpython.rs",
	"languages/python/src/syntax/tests.rs",
]

[[scope]]
rust_file = "syntax/groups.rs"
classification = "rezel-owned"
invariant = "Comma-separated CST grouping cannot turn visible comments or trailing layout into phantom grammatical items."
representation = "One linear grouping utility excludes delimiters and layout without allocating persistent CST nodes."
evidence_files = [
	"languages/python/tests/reference/cpython.rs",
	"tools/references/cpython/stdlib/src/main.rs",
]

[[scope]]
rust_file = "syntax/patterns.rs"
classification = "rezel-owned"
invariant = "Structural-pattern alternatives expose literal, sequence, mapping, rest, and grouping roles before AST lowering."
representation = "Typed pattern views normalize flattened Lezer productions into short-lived grammatical shapes."
evidence_files = [
	"languages/python/tests/reference/cpython.rs",
	"languages/python/src/syntax/tests.rs",
]

[[scope]]
rust_file = "syntax/statements.rs"
classification = "rezel-owned"
invariant = "With statements expose async, context, optional target, and body roles without raw traversal in AST lowering."
representation = "A short-lived statement view performs one direct-child scan over the maintained CST."
evidence_files = [
	"languages/python/tests/reference/cpython.rs",
	"languages/python/src/syntax/tests.rs",
]

[[scope]]
rust_file = "syntax/strings.rs"
classification = "rezel-owned"
invariant = "Formatted and template strings preserve source segments, debug spelling, conversions, and nested format specifications without expanding the CST."
representation = "Source-backed ranges and typed interpolation nodes form an ephemeral part stream consumed by AST lowering."
evidence_files = [
	"languages/python/tests/reference/cpython.rs",
	"languages/python/src/syntax/tests.rs",
]

[[scope]]
rust_file = "syntax/tests.rs"
classification = "rezel-owned"
invariant = "Private Python syntax views preserve their grammatical roles across representative flattened CST shapes."
representation = "Module-local tests exercise the non-public syntax-shape adapters at their ownership boundary."
evidence_files = ["languages/python/src/syntax/tests.rs"]

[[scope]]
rust_file = "syntax/validate.rs"
classification = "rezel-owned"
invariant = "Strict parsing and AST lowering share one typed validation boundary for context-sensitive CPython ast.parse constraints."
representation = "A recursive typed CST validator consumes syntax-shape views without adding persistent nodes or moving grammar-shape inspection into AST construction."
evidence_files = [
	"languages/python/tests/contract.rs",
	"languages/python/tests/reference/cpython.rs",
	"tools/references/cpython/stdlib/src/main.rs",
]

[[scope]]
rust_file = "ast/lower.rs"
classification = "rezel-owned"
invariant = "Strict current Python CST lowers to the CPython 3.14 public AST surface, while inherited CST-only extensions fail explicitly."
representation = "A checked traversal builds an owned arena projection and applies CPython context, constant, type-comment, and source-range rules."
evidence_files = [
	"languages/python/tests/lowering.rs",
	"languages/python/tests/reference/cpython.rs",
]

[[scope]]
rust_file = "ast/mod.rs"
classification = "rezel-owned"
invariant = "The public Python AST module exposes the stable owned model, generated schema, options, and lowering errors."
representation = "A narrow module facade hides lowering and builder internals."
evidence_files = ["languages/python/tests/lowering.rs"]

[[scope]]
rust_file = "ast/model.rs"
classification = "rezel-owned"
invariant = "The owned Python AST exposes stable node identities, CPython-aligned kinds and fields, source ranges, constants, lists, and interned strings."
representation = "Contiguous node and string arenas replace CPython object identities while preserving ordered fields."
evidence_files = ["languages/python/tests/lowering.rs"]

[[scope]]
rust_file = "ast/schema.rs"
classification = "rezel-owned"
invariant = "Python AST kind and field names are deterministically generated from the pinned CPython 3.14.5 public schema."
representation = "Checked non-exhaustive Rust enums project ast class and _fields identities."
evidence_files = [
	"tools/references/cpython/ast_schema.py",
	"tools/references/cpython/snapshots/python.json",
]

[[override_item]]
rust_item = "rezel_python::python_highlighting"
classification = "adapted"
upstream_file = "src/highlight.js"
upstream_symbols = ["pythonHighlighting"]
invariant = "Python CST nodes project upstream syntactic tags extended for maintained Python 3.14 nodes."
representation = "A feature-gated Rust NodePropSource replaces the JavaScript styleTags object."
