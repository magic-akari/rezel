invariant = "Pinned grammar constructs accepted over Unicode-scalar source produce the corresponding AST and semantic source locations, with matching accept-or-reject behavior for the upstream conformance cases."
representation = "A safe UTF-8 cursor and Rust enums replace the mutable JavaScript token object; diagnostics and all exposed positions use UTF-8 byte offsets and Rust strings cannot contain isolated UTF-16 surrogates."
