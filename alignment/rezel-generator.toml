[[scope]]
rust_file = "lib.rs"
classification = "rezel-owned"
invariant = "The crate root exposes grammar parsing, compilation, diagnostics, and deterministic Rust emission as one downstream-facing API."
representation = "Rust crate and module packaging is Rezel-owned; provenance for the implementation is recorded against the files that define it."

[[scope]]
rust_file = "automaton.rs"
classification = "adapted"
upstream_file = "src/automaton.ts"
upstream_symbols = [
	"Pos",
	"Shift",
	"Reduce",
	"State",
	"computeFirstSets",
	"buildFullAutomaton",
	"finishAutomaton",
	"closure",
	"termsAhead",
	"applyCut",
	"canMerge",
	"mergeStates",
	"collapseAutomaton",
	"mergeIdentical",
]
invariant = "Canonical LR(1) closure and actions are built first, compatible same-core states collapse conservatively, and behavior-identical states merge deterministically."
representation = "Sorted Rust vectors and stable indices replace JavaScript object identity and comparison helpers without introducing IELR partitioning."
evidence_files = ["crates/rezel-generator/tests/cases.rs"]

[[scope]]
rust_file = "binding.rs"
classification = "rezel-owned"
invariant = "Every grammar-declared external resolves to exactly one statically linked Rust path with the same semantic role, source module, and exported name."
representation = "A strict TOML manifest and typed binding keys validate the boundary between JavaScript grammar declarations and generated Rust symbols."
evidence_files = [
	"crates/rezel-generator/tests/cases.rs",
	"languages/json/grammar/json.bindings.toml",
	"tools/codegen/src/main.rs",
]

[[scope]]
rust_file = "build.rs"
classification = "adapted"
upstream_file = "src/build.ts"
upstream_symbols = [
	"BuildOptions",
	"Builder",
	"Builder.prepareParser",
	"Parts",
	"BuiltRule",
	"DataBuilder",
	"TokenSet",
	"TokenGroup",
	"LocalTokenSet",
	"MainTokenSet",
	"ExternalTokenSet",
	"ExternalSpecializer",
	"FinishStateContext",
	"inlineRules",
	"mergeRules",
	"simplifyRules",
	"computeGotoTable",
	"reduceAction",
	"rangeEdges",
	"buildSpecializeTable",
	"buildTokenMasks",
	"findSkipStates",
	"isLiteralToken",
]
invariant = "Grammar normalization, skip scopes, specialization, token conflicts, parser tables, dialects, node properties, and runtime metadata preserve the pinned generator's observable parse behavior except at documented Rezel-owned boundaries."
representation = "One Rust builder produces typed metadata for a static Rust backend; warnings are returned as structured diagnostics, external declarations remain symbolic until emission, and goto groups retain the pinned compact ABI with an explicitly selected loose default."
evidence_files = [
	"crates/rezel-generator/tests/cases.rs",
	"crates/rezel-generator/tests/parse.rs",
	"tools/codegen/src/main.rs",
]

[[override_item]]
rust_item = "rezel_generator::build::compute_goto_table"
classification = "rezel-owned"
invariant = "Strict goto transitions preserve every generated source-to-target mapping, while loose recovery uses the target that covers the largest source-state group."
representation = "The pinned generator makes the numerically last target the compact table fallback; Rezel selects the largest source group and uses the highest target only as a deterministic tie-breaker."
evidence_files = ["crates/rezel-generator/tests/cases.rs"]

[[scope]]
rust_file = "emit.rs"
classification = "rezel-owned"
invariant = "A compiled grammar deterministically emits valid static Rust tables, node metadata, term identifiers, and direct external symbol references."
representation = "quote and proc-macro2 generate Rust syntax, syn validates it, prettyplease formats it, and a sequential writer emits large numeric arrays."
evidence_files = [
	"crates/rezel-generator/tests/cases.rs",
	"tools/codegen/src/main.rs",
]

[[scope]]
rust_file = "source.rs"
classification = "rezel-owned"
invariant = "Every generated Rust source carries a stable generator marker without allowing Rust parsing or formatting to discard it."
representation = "Generated bodies are parsed and formatted first, then the plain-text ownership marker is prepended outside the token and syntax-tree pipeline."
evidence_files = [
	"crates/rezel-generator/src/source.rs",
	"tools/codegen/src/main.rs",
]

[[scope]]
rust_file = "error.rs"
classification = "adapted"
upstream_file = "src/error.ts"
upstream_symbols = ["GenError"]
invariant = "Fatal grammar failures remain ordinary generator errors with a stable human-readable message."
representation = "An owned Rust Error adds an optional UTF-8 byte position to the upstream exception role."
evidence_files = ["crates/rezel-generator/tests/cases.rs"]

[[scope]]
rust_file = "grammar.rs"
classification = "adapted"
upstream_file = "src/grammar.ts"
upstream_symbols = [
