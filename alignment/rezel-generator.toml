]
invariant = "Term flags, output numbering, conflict joins, rule comparison, repeat wrappers, preservation, and inline eligibility follow the pinned grammar model."
representation = "Stable vector indices replace object identity, and checked u16 conversion enforces the static runtime table ABI."
evidence_files = ["crates/rezel-generator/tests/cases.rs"]

[[scope]]
rust_file = "main.rs"
classification = "rezel-owned"
invariant = "The CLI checks one grammar and writes deterministic parser or term source while reporting structured warnings."
representation = "A dependency-light Rust binary provides check, generate, and terms subcommands for the static Rust backend."

