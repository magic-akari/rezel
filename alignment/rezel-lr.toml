[[override_item]]
rust_item = "rezel_lr::parse::ContextTracker::tracks_reduction"
classification = "rezel-owned"
invariant = "An omitted reduction callback or a reduction term outside its declared relevant set remains the identity operation and cannot alter the current context."
representation = "Rust preserves an omitted callback as None and combines callback presence with a conservative folded term filter; an absent filter bit bypasses context cloning and input reset, while collisions retain the pinned callback path."
