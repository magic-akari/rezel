schema_version = 1

[component]
name = "rezel-lr"
source_root = "crates/rezel-lr/src"

[upstream]
repository = "https://github.com/lezer-parser/lr"
commit = "cc19ad7661e6c8ff8c038fb0f592f4dc005dd261"

[[snapshot]]
source = "src/constants.ts"
path = "alignment/upstream/lr/constants.json"

[[snapshot]]
source = "src/decode.ts"
path = "alignment/upstream/lr/decode.json"

[[snapshot]]
