[[scope]]
rust_file = "lib.rs"
classification = "rezel-owned"
invariant = "The crate root exposes the supported static-table LR runtime as one coherent API for generated parser crates."
representation = "Rust crate and module packaging is Rezel-owned; provenance for re-exported declarations is recorded against the files that define them."

[[scope]]
rust_file = "constants.rs"
classification = "adapted"
upstream_file = "src/constants.ts"
upstream_symbols = ["Action", "StateFlag", "ParseState", "Seq", "Term"]
invariant = "Generated action bit fields, state-record offsets, sequence sentinels, flags, and the reserved error term retain the pinned runtime's numeric ABI."
representation = "Rust uses transparent newtypes and repr enums with const accessors; generated action, state, goto, and metadata tables remain raw numeric slices while token DFAs use typed records."

[[scope]]
rust_file = "decode.rs"
classification = "adapted"
upstream_file = "src/parse.ts"
upstream_symbols = ["pair"]
invariant = "Two compact little-endian words reconstruct the exact unsigned action emitted by the generator."
representation = "Static Rust slices replace JavaScript typed arrays and encoded parser strings."

[[scope]]
rust_file = "action_index.rs"
classification = "rezel-owned"
invariant = "Parser-private lookup preserves every generated action, continuation, skip action, same-terminal ordering, and fallback from the compact Lezer-compatible action sequences."
representation = "Validated compact rows are projected once into sorted contiguous terminal/action arrays; short rows use linear lookup, while longer action rows use a folded 32-bit negative membership filter before exact binary partitioning. Filter collisions fall through to exact lookup, a conservative global skip-terminal bitmap bypasses the second lookup only when no generated skip sequence can match, and generated tables remain authoritative."
evidence_files = [
	"crates/rezel-lr/src/action_index.rs",
	"crates/rezel-generator/tests/parse.rs",
	"languages/json/tests/reference.rs",
]

[[scope]]
rust_file = "parse.rs"
classification = "adapted"
upstream_file = "src/parse.ts"
upstream_symbols = [
	"Dialect",
	"ContextTracker",
	"TokenCache",
	"Rec",
	"Parse",
	"LRParser",
	"LRParser.configure",
	"findFinished",
	"pushStackDedup",
]
invariant = "State-driven tokenization, LR and bounded GLR actions, dynamic precedence, deterministic pruning, recovery, and completion produce the selected top rule's concrete syntax tree."
representation = "Generated data is held in a construction-validated static Language with term-indexed action and goto projections plus unchecked hot reads; the validated maximum node id and first repeat term are cached in ParserCore for shift, reduction, recovery, and tree classification, while selected-top fields and strict mode share one compact internal record; TokenCache borrows full per-tokenizer cache records while retaining only start, value, and end in its observable main-token snapshot; parser configuration is owned, input positions use UTF-8 TextSize values, failures use Result, incremental fragments are excluded, and the non-incremental default packs larger tree buffers while preserving the configurable Lezer build contract."
evidence_files = ["crates/rezel-lr/tests/validation.rs"]

[[scope]]
rust_file = "stack.rs"
classification = "adapted"
upstream_file = "src/stack.ts"
upstream_symbols = [
	"Recover",
	"Stack",
	"Stack.reduce",
	"Stack.shift",
	"Stack.split",
	"Stack.recoverByDelete",
	"Stack.recoverByInsert",
	"Stack.forceReduce",
	"Stack.canShift",
	"SimulatedStack",
	"StackBufferCursor",
]
invariant = "Shift, reduce, bounded branch splitting, recovery scoring, forced reductions, stack equivalence, and context transitions preserve the pinned runtime's action semantics."
representation = "Rust stores typed frames, shares immutable postfix-prefix chunks across branches, retains only a branch-local mutable suffix, and exposes a backward cursor that feeds tree construction directly; can-shift simulations borrow the live frame prefix and materialize it only when a zero-depth reduction must append a frame; parser failures are explicit and reused-node records are absent."

[[override_item]]
rust_item = "rezel_lr::stack::MIN_BRANCH_BUFFER_CAPACITY"
classification = "rezel-owned"
invariant = "Reserving capacity for an active post-split tail never changes its logical postfix length, record contents, sharing boundary, or parser resource accounting, and an unwritten branch remains allocation-free."
representation = "The first record written to an empty GLR branch tail reserves capacity for eight four-word CST records to avoid repeatedly growing very small Rust Vec buffers."
evidence_files = [
	"crates/rezel-generator/tests/cases.rs",
	"crates/rezel-generator/tests/parse.rs",
	"languages/java/tests/reference.rs",
	"languages/go/tests/reference.rs",
]

[[scope]]
rust_file = "token.rs"
classification = "adapted"
upstream_file = "src/token.ts"
upstream_symbols = [
	"InputStream",
	"Tokenizer",
	"TokenGroup",
	"LocalTokenGroup",
	"ExternalTokenizer",
	"readToken",
	"overrides",
]
invariant = "Only tokenizers enabled by the current state run, with longest-match, precedence, fallback, extend, local-token, dialect, specialization, and external-token semantics."
representation = "Tokenizer code observes logical code points over cached identity-mapped input chunks while public positions remain UTF-8 byte offsets; opaque stream marks preserve token endpoints across multi-byte characters and selected ranges, reads may borrow scalar text, external tokenizers can traverse sequential lookahead through one forward cursor, bounded ASCII runs use prevalidated identity windows, generated DFA self-loops consume maximal same-state ASCII runs before acceptance is rechecked, other ASCII transitions reuse their already classified byte when advancing that window, and Rust externals are static fallible function pointers."

[[override_item]]
rust_item = "rezel_lr::token::TokenAsciiIndex"
classification = "rezel-owned"
invariant = "Every indexed ASCII transition resolves to the same next DFA state as the authoritative global or local token table, while missing and non-ASCII transitions retain the typed-table path."
representation = "Parser construction projects every generated global and local TokenTable state's ASCII edges into immutable dense rows shared by parser clones; non-ASCII transitions continue through the authoritative half-open code-point edges."
evidence_files = [
	"crates/rezel-lr/src/token.rs",
	"crates/rezel-lr/tests/validation.rs",
	"languages/json/tests/reference.rs",
	"languages/java/tests/reference.rs",
	"languages/go/tests/reference.rs",
]

[[override_item]]
rust_item = "rezel_lr::parse::ParseLimits"
classification = "rezel-owned"
invariant = "Explicit budgets bound parser work and turn exhausted resources into typed failures."
representation = "Rezel exposes configurable action, stack, buffer, and recovery limits that are not part of the JavaScript runtime API."

[[override_item]]
rust_item = "rezel_lr::parse::LRParser::with_create_parse"
classification = "rezel-owned"
invariant = "A language package may translate the lexical input or wrap a partial parse without replacing or narrowing the common LRParser facade."
representation = "A hidden static Rust function prepares each request and re-enters the same LR engine exactly once after language-owned setup."

[[override_item]]
rust_item = "rezel_lr::parse::LRParser::create_lr_parse"
classification = "rezel-owned"
invariant = "A prepared language request enters the ordinary LR engine exactly once and retains every configured parse wrapper."
representation = "The hidden Rust method separates language-owned request preparation from the shared LR parse constructor."

[[override_item]]
rust_item = "rezel_lr::parse::ContextTracker::tracks_reductions"
classification = "rezel-owned"
invariant = "An omitted reduction transition remains the identity operation and cannot alter the current context."
representation = "Rust preserves an omitted callback as None and bypasses context cloning and input reset; the pinned runtime installs and invokes an identity callback instead."
evidence_files = [
	"languages/go/tests/parse.rs",
	"languages/go/tests/reference.rs",
]

[[override_item]]
rust_item = "rezel_lr::parse::ContextTracker::with_shift_without_input"
classification = "rezel-owned"
invariant = "Opting into an input-independent shift callback preserves its context transition while making input observation impossible through the callback type."
representation = "The pinned runtime resets input before every context callback; an explicit Rust builder accepts a callback without InputStream and lets the runtime bypass that reset."
evidence_files = [
	"languages/go/tests/parse.rs",
	"languages/go/tests/reference.rs",
]

[[override_item]]
rust_item = "rezel_lr::parse::ContextTracker::with_shift_input_terms"
classification = "rezel-owned"
invariant = "A term-scoped input contract preserves every context transition when its callback observes InputStream only for the declared shifted terms."
representation = "The pinned runtime resets input before every context shift; a static Rust tracker may declare the exact terms whose callback observes input and leave the stream cursor untouched for every other term."
evidence_files = [
	"languages/python/tests/contract.rs",
	"languages/python/tests/reference/lezer.rs",
]

[[override_item]]
rust_item = "rezel_lr::parse::ContextTracker::with_reduce_without_input"
classification = "rezel-owned"
invariant = "Opting into an input-independent reduce callback preserves its context transition while making input observation impossible through the callback type."
representation = "The pinned runtime resets input before every context callback; an explicit Rust builder accepts a callback without InputStream and lets the runtime bypass that reset."
evidence_files = [
	"languages/python/tests/contract.rs",
	"languages/python/tests/reference/lezer.rs",
]

