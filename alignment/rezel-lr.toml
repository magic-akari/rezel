classification = "rezel-owned"
invariant = "A language package may translate the lexical input or wrap a partial parse without replacing or narrowing the common LRParser facade."
representation = "A hidden static Rust function prepares each request and re-enters the same LR engine exactly once after language-owned setup."

[[override_item]]
rust_item = "rezel_lr::parse::LRParser::create_lr_parse"
classification = "rezel-owned"
invariant = "A prepared language request enters the ordinary LR engine exactly once and retains every configured parse wrapper."
representation = "The hidden Rust method separates language-owned request preparation from the shared LR parse constructor."

[[override_item]]
rust_item = "rezel_lr::parse::Parse::advance_stack"
classification = "rezel-owned"
invariant = "Consecutive default reductions and unique non-consuming token actions execute in generated order with identical action-budget, cut-depth, token-cache, context, dynamic-precedence, stack, CST, recovery, and completion effects, and batching stops at the first consuming action or ambiguous stack split."
representation = "The pinned runtime returns to its parse scheduler after each default reduction or token action. Rust exhausts the deterministic same-position chain inside one advance-stack call: adjacent default reductions run as one group, and every unique non-consuming token action is followed by the cut-depth and token-action lookup performed on scheduler reentry, eliminating token-cache invalidation, position checks, and function reentry between them."
evidence_files = [
	"crates/rezel-lr/src/parse.rs",
	"crates/rezel-generator/tests/cases.rs",
