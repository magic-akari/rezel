[[scope]]
rust_file = "lib.rs"
classification = "rezel-owned"
invariant = "The crate root exposes the supported static-table LR runtime as one coherent API for generated parser crates."
representation = "Rust crate and module packaging is Rezel-owned; provenance for re-exported declarations is recorded against the files that define them."

[[scope]]
rust_file = "constants.rs"
classification = "adapted"
upstream_file = "src/constants.ts"
upstream_symbols = ["Action", "StateFlag", "ParseState", "Seq", "Term"]
invariant = "Generated action bit fields, state-record offsets, sequence sentinels, flags, and the reserved error term retain the pinned runtime's numeric ABI."
representation = "Rust uses transparent newtypes and repr enums with const accessors; generated action, state, goto, and metadata tables remain raw numeric slices while token DFAs use typed records."

[[scope]]
rust_file = "decode.rs"
classification = "adapted"
upstream_file = "src/parse.ts"
upstream_symbols = ["pair"]
invariant = "Two compact little-endian words reconstruct the exact unsigned action emitted by the generator."
representation = "Static Rust slices replace JavaScript typed arrays and encoded parser strings."

[[scope]]
rust_file = "action_index.rs"
classification = "rezel-owned"
invariant = "Parser-private lookup preserves every generated default reduction, action, continuation, skip action, same-terminal ordering, and fallback from the compact Lezer-compatible state and action sequences."
representation = "Validated compact rows are projected once into sorted contiguous terminal/action arrays. Each runtime state record co-locates its two projected row ids with the typed default-reduction action so deterministic reduction chains do not repeatedly address and wrap the six-field generated state record, while separate byte and u32 projections retain the generated skipped-state bit and tokenizer mask without enlarging that compact record. Shifts, reductions, and token lookup read those projections directly instead of recomputing a six-field state-table address. Every action and skip row first uses a folded 32-bit negative membership filter to reject impossible terminals; exact matches retain ordered linear lookup for short rows and binary partitioning for longer rows. Single-action short-row queries return the first source-ordered match and stop once the sorted term passes the target. Error actions, source orders, and their precedence loop are kept in a sparse side index only when a generated row contains an Error catch-all; ordinary tables use 16-byte action rows and an error-free lookup loop. Matches remain entry indexes until precedence is resolved, and only the winning action is loaded. GLR visits still emit every adjacent equal-term action. Filter collisions fall through to exact lookup, a conservative global skip-terminal bitmap bypasses the second lookup only when no generated skip sequence can match, and generated tables remain authoritative."
evidence_files = [
	"crates/rezel-lr/src/action_index.rs",
	"crates/rezel-generator/tests/parse.rs",
	"languages/json/tests/reference.rs",
]

[[scope]]
rust_file = "goto_index.rs"
classification = "rezel-owned"
invariant = "Parser-private lookup preserves every strict source-to-target transition and the generated table's selected loose fallback after construction validation."
representation = "Validated term-major groups are projected once into one default target, its strict source-membership list, and compact exact-match exceptions. Short exception rows retain generated order for linear lookup; longer rows use a contiguous balanced-search layout while generated tables remain authoritative."
evidence_files = [
	"crates/rezel-lr/src/goto_index.rs",
	"crates/rezel-lr/tests/validation.rs",
	"crates/rezel-generator/tests/cases.rs",
	"languages/java/tests/reference.rs",
	"languages/go/tests/reference.rs",
]

[[scope]]
rust_file = "parse.rs"
classification = "adapted"
upstream_file = "src/parse.ts"
upstream_symbols = [
	"Dialect",
	"ContextTracker",
	"TokenCache",
	"Rec",
	"Parse",
	"LRParser",
	"LRParser.configure",
	"findFinished",
	"pushStackDedup",
]
invariant = "State-driven tokenization, ordered same-base specialization, LR and bounded GLR actions, dynamic precedence, deterministic pruning, recovery, and completion produce the selected top rule's concrete syntax tree."
representation = "Generated data is held in a construction-validated static Language with term-indexed action and goto projections plus unchecked hot reads; same-base specializers run in generated order until the first dialect-allowed result, with a single-entry fast path; the validated maximum node id and first repeat term are cached in ParserCore for shift, reduction, recovery, and tree classification, while selected-top fields and strict mode share one compact internal record; strict parsers may apply language-owned spelling validators to a selected base token before its LR action, without adding grammar instructions or affecting recovery mode; TokenCache borrows full per-tokenizer cache records whose direct u16 value uses the reserved Error term for default and declined entries, while retaining only start, value, and end in its observable main-token snapshot, holding the deterministic first token action inline, and spilling only ambiguous alternatives into a reusable vector; parser configuration is owned, context trackers may conservatively declare terms whose transitions are not the identity, input positions use UTF-8 TextSize values, failures use Result, incremental fragments are excluded, and the non-incremental default packs larger tree buffers while preserving the configurable Lezer build contract."
evidence_files = ["crates/rezel-lr/tests/validation.rs"]

[[scope]]
rust_file = "stack.rs"
classification = "adapted"
upstream_file = "src/stack.ts"
upstream_symbols = [
	"Recover",
	"Stack",
	"Stack.reduce",
	"Stack.shift",
	"Stack.split",
	"Stack.recoverByDelete",
	"Stack.recoverByInsert",
	"Stack.forceReduce",
	"Stack.canShift",
	"SimulatedStack",
	"StackBufferCursor",
]
invariant = "Shift, reduce, bounded branch splitting, recovery scoring, forced reductions, stack equivalence, and context transitions preserve the pinned runtime's action semantics."
representation = "Rust stores typed frames, shares immutable postfix-prefix chunks across branches, retains only a branch-local mutable suffix, and exposes a backward cursor that feeds tree construction directly; can-shift simulations borrow the live frame prefix and materialize it only when a zero-depth reduction must append a frame; context applicability guards are inlined while actual tracked transitions are outlined, and the current context hash is stored directly on Stack for token-cache keys; parser failures are explicit and reused-node records are absent."

[[override_item]]
rust_item = "rezel_lr::stack::MIN_BRANCH_BUFFER_CAPACITY"
classification = "rezel-owned"
invariant = "Reserving capacity for an active post-split tail never changes its logical postfix length, record contents, sharing boundary, or parser resource accounting, and an unwritten branch remains allocation-free."
representation = "The first record written to an empty GLR branch tail reserves capacity for eight four-word CST records to avoid repeatedly growing very small Rust Vec buffers."
evidence_files = [
	"crates/rezel-generator/tests/cases.rs",
	"crates/rezel-generator/tests/parse.rs",
	"languages/java/tests/reference.rs",
	"languages/go/tests/reference.rs",
]

[[scope]]
rust_file = "token.rs"
classification = "adapted"
upstream_file = "src/token.ts"
upstream_symbols = [
	"InputStream",
	"Tokenizer",
	"TokenGroup",
	"LocalTokenGroup",
	"ExternalTokenizer",
	"readToken",
	"overrides",
]
invariant = "Only tokenizers enabled by the current state run, with longest-match, precedence, fallback, extend, local-token, dialect, specialization, and external-token semantics."
representation = "Tokenizer code observes logical code points over cached identity-mapped input chunks while public positions remain UTF-8 byte offsets; opaque stream marks preserve token endpoints across multi-byte characters and selected ranges, reads may borrow scalar text, external tokenizers can traverse sequential lookahead through one forward cursor, adjacent ASCII lookbehind resolves directly from the active identity window while Unicode, translation, and selected-range boundaries retain the authoritative reverse cursor, bounded ASCII runs use prevalidated identity windows, generated DFA self-loops consume maximal same-state ASCII runs before acceptance is rechecked, other ASCII transitions reuse their already classified byte when advancing that window, and Rust externals are static fallible function pointers with optional conservative first-code-point filters."

[[override_item]]
rust_item = "rezel_lr::token::ExternalTokenizerStart"
classification = "rezel-owned"
invariant = "Skipping an external tokenizer is permitted only when its callback cannot accept at the current logical token-start code point or end-of-input position; enabled tokenizer order, caching, fallback, extend, and action semantics remain unchanged."
representation = "Language adapters may attach a const two-word ASCII bitmap plus non-ASCII and end-of-input flags to an external tokenizer. Parser construction compiles those filters into per-code-point tokenizer masks; TokenCache reads the logical stack-position character once and intersects the current state's tokenizer mask before dispatch, while tokenizers without a set remain unfiltered."
