schema_version = 1

[component]
name = "rezel-java"
source_root = "languages/java/src"

[upstream]
repository = "https://github.com/lezer-parser/java"
commit = "63e9e5f056651ca149e936782d0f81afd9bcdfa9"

[[snapshot]]
source = "src/highlight.js"
path = "alignment/upstream/java/highlight.json"

[[scope]]
rust_file = "generated.rs"
classification = "rezel-owned"
invariant = "The checked static parser is regenerated byte-for-byte from the maintained Java 26 grammar and statically imports every declared external by its module and symbol name."
representation = "Rezel's Rust generator emits immutable runtime tables from the maintained grammar and resolves relative external modules directly into the crate module tree."
evidence_files = [
	"languages/java/src/java.grammar",
	"tools/codegen/src/main.rs",
	"languages/java/tests/reference/lezer.rs",
]

[[scope]]
rust_file = "highlighting.rs"
classification = "adapted"
upstream_file = "src/highlight.js"
upstream_symbols = ["javaHighlighting"]
invariant = "Java syntax nodes project the pinned language package's abstract highlight tags, extended only for maintained Java 26 grammar nodes."
representation = "A feature-gated Rust NodePropSource replaces the JavaScript styleTags object; parsing without the feature binds an inert property source."

[[scope]]
rust_file = "identifier.rs"
classification = "standard-algorithm"
invariant = "External Java identifier tokenization follows Java 26 Character identifier properties, removes identifier-ignorable code points only when deriving cooked names, and specializes record only where the parser can shift the contextual keyword."
representation = "Generated Unicode 17 scalar ranges, a Latin-1 equivalent fast path, and a Unicode code-point scanner replace calls into the Java Character API; identity-mapped ASCII identifier runs advance in bulk and fall back at translations and non-ASCII input, while one exact-spelling external specializer consults the current LR stack before classifying record."
evidence_files = [
	"languages/java/tests/contract.rs",
	"languages/java/tests/reference/javac.rs",
	"languages/java/tests/reference/lezer.rs",
]

[[scope]]
rust_file = "input.rs"
classification = "standard-algorithm"
invariant = "JLS Unicode escapes are translated before tokenization while every observable source range remains an original UTF-8 byte range."
representation = "A sorted escape index combines translated surrogate pairs into logical code points, preserves isolated surrogates, and exposes shared identity chunks without materializing a translated source string."
evidence_files = [
	"languages/java/tests/contract.rs",
	"languages/java/tests/reference/javac.rs",
	"languages/java/tests/reference/lezer.rs",
]

[[scope]]
rust_file = "lib.rs"
classification = "rezel-owned"
invariant = "The Java facade cheaply clones immutable generated language data, applies Java lexical translation exactly once, and remains composable through the common Parser interface."
representation = "JavaParser delegates configuration and parsing to LRParser while mapping arbitrary immutable Input values through the Java logical view."
evidence_files = [
	"languages/java/tests/contract.rs",
	"languages/java/tests/reference/lezer.rs",
	"tools/references/javac/stdlib/src/main.rs",
]

[[scope]]
rust_file = "terms.rs"
classification = "rezel-owned"
