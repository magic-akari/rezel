schema_version = 1

[component]
name = "rezel-go"
source_root = "languages/go/src"

[upstream]
repository = "https://code.haverbeke.berlin/lezer/go"
commit = "a419e05c2a992ffbb53411904ee02dde3e728b37"

[[snapshot]]
source = "src/go.grammar"
path = "alignment/upstream/go/grammar.json"

[[snapshot]]
source = "src/highlight.js"
path = "alignment/upstream/go/highlight.json"

[[snapshot]]
source = "src/tokens.js"
path = "alignment/upstream/go/tokens.json"

[[scope]]
rust_file = "generated.rs"
classification = "rezel-owned"
invariant = "The checked static parser is regenerated byte-for-byte from the maintained Go 1.26 grammar and statically binds every declared external."
representation = "Rezel's Rust generator emits immutable runtime tables from the maintained grammar and checked binding manifest."
evidence_files = [
	"languages/go/grammar/go.grammar",
	"languages/go/grammar/go.bindings.toml",
	"tools/codegen/src/main.rs",
	"languages/go/tests/parse.rs",
	"languages/go/tests/reference/lezer.rs",
]

[[scope]]
rust_file = "lib.rs"
classification = "rezel-owned"
invariant = "The Go facade cheaply clones immutable generated language data and exposes typed syntax, owned AST lowering, and optional syntactic highlighting."
representation = "A process-wide OnceLock owns the default parser while callers configure owned LRParser clones."
evidence_files = [
	"languages/go/tests/contract.rs",
	"languages/go/tests/lowering.rs",
	"languages/go/tests/reference/go.rs",
	"languages/go/tests/reference/lezer.rs",
	"tools/references/go/stdlib/src/main.rs",
]

[[scope]]
rust_file = "terms.rs"
classification = "rezel-owned"
invariant = "Named and explicitly exported Go grammar terms have deterministic identifiers shared by generated tables and external callbacks."
representation = "Rezel's Rust generator emits constants directly from the maintained Go grammar."
evidence_files = ["tools/codegen/src/main.rs"]

[[scope]]
rust_file = "tokens.rs"
classification = "adapted"
upstream_file = "src/tokens.js"
upstream_symbols = ["semicolon", "trackTokens"]
invariant = "Automatic semicolon insertion preserves upstream line-ending, comment, delimiter, and preceding-token behavior while recognizing the Go specification's predeclared literal terms."
representation = "Typed Rust callbacks replace JavaScript token and context objects; generated exported term identities avoid rescanning specialized literals, and two process-interned immutable contexts preserve primitive boolean identity. The semicolon callback follows cached input directly for immediate decisions and traverses whitespace and comments through one sequential lookahead cursor. The shift callback's type records that it cannot observe input, allowing the shared runtime to skip Lezer's input reset without introducing Go-specific logic there."
evidence_files = [
	"languages/go/tests/contract.rs",
	"languages/go/tests/parse.rs",
	"languages/go/tests/reference/lezer.rs",
]

[[scope]]
rust_file = "typed.rs"
classification = "rezel-owned"
invariant = "Generated typed syntax preserves Go CST node identity and exposes lazy direct-child accessors for the maintained grammar."
representation = "Checked Rust wrappers implement Rezel's TypedNode API from the declarative Go typed schema."
evidence_files = [
	"languages/go/grammar/go.typed.toml",
	"tools/codegen/src/main.rs",
	"languages/go/tests/typed.rs",
]

[[scope]]
rust_file = "syntax/mod.rs"
classification = "rezel-owned"
invariant = "Owned AST lowering reaches grammar-shaped Go CST roles only through crate-private syntax views."
representation = "Short-lived typed adapters normalize flattened, recursive, and delimiter-sensitive productions without adding persistent syntax state or dynamic dispatch."
evidence_files = ["languages/go/tests/lowering.rs"]

[[scope]]
rust_file = "syntax/declarations.rs"
classification = "rezel-owned"
invariant = "Go declarations expose stable names, receivers, type parameters, signatures, bodies, and grouped specs independently of raw CST child order."
representation = "Ephemeral declaration views classify direct typed children and synthesize no additional tree nodes."
evidence_files = ["languages/go/tests/lowering.rs"]

[[scope]]
rust_file = "syntax/expressions.rs"
classification = "rezel-owned"
invariant = "Go operands, operators, arguments, keys, values, and literal elements have one normalized interpretation shared by AST lowering."
representation = "Linear typed-child adapters preserve source-backed nodes and expose each LR-shaped unary, binary, or postfix expression layer without flattening its association."
evidence_files = ["languages/go/tests/lowering.rs"]

[[scope]]
rust_file = "syntax/statements.rs"
classification = "rezel-owned"
invariant = "Go statement headers and bodies expose their grammatical roles without positional traversal in the owned AST lowerer."
representation = "Short-lived statement views classify direct typed children on demand and retain no semantic tree."
evidence_files = ["languages/go/tests/lowering.rs"]

[[scope]]
rust_file = "syntax/types.rs"
classification = "rezel-owned"
invariant = "Go type expressions expose element, key, value, direction, constraint, parameter, and result roles independently of CST association."
representation = "Typed source-backed views normalize recursive and delimiter-sensitive type productions before AST projection."
evidence_files = ["languages/go/tests/lowering.rs"]

[[scope]]
rust_file = "ast/build_constraint.rs"
classification = "standard-algorithm"
invariant = "Valid top-of-file //go:build expressions derive the minimum Go version represented by go/ast.File.GoVersion."
representation = "A bounded boolean-expression parser and structural minimum-version fold implement the public go/build/constraint grammar without a runtime Go dependency."
evidence_files = [
	"languages/go/src/ast/build_constraint.rs",
	"languages/go/tests/reference/go.rs",
]

[[scope]]
rust_file = "ast/lower.rs"
classification = "rezel-owned"
invariant = "Strict Go typed syntax lowers to the ordered public go/ast and go/token syntax surface, including comments and source positions."
representation = "A checked traversal builds compact arenas, groups Lezer case siblings, and iteratively lowers the precedence and association already resolved by the generated LR parser."
evidence_files = [
	"languages/go/tests/contract.rs",
	"languages/go/tests/lowering.rs",
	"languages/go/tests/reference/go.rs",
]

[[scope]]
rust_file = "ast/mod.rs"
classification = "rezel-owned"
invariant = "The public Go AST module exposes only the stable owned syntax model and lowering errors."
representation = "A narrow Rust module facade hides lowering and build-constraint internals while re-exporting durable arena types."
evidence_files = [
	"languages/go/tests/lowering.rs",
	"languages/go/tests/reference/go.rs",
]

[[scope]]
rust_file = "ast/model.rs"
classification = "rezel-owned"
invariant = "The owned Go AST exposes stable node identities, public Go syntax kinds and fields, source positions, tokens, directions, and interned strings."
representation = "Contiguous node, field, node-list, and string arenas replace Go pointer-rich structs while preserving their ordered public projection."
evidence_files = [
	"languages/go/tests/lowering.rs",
	"languages/go/tests/reference/go.rs",
]

[[override_item]]
rust_item = "rezel_go::generated::LANGUAGE"
classification = "adapted"
upstream_file = "src/go.grammar"
upstream_symbols = ["expr", "@precedence"]
invariant = "Postfix selectors, indexing, slicing, assertions, and calls bind more tightly than unary and binary operators, matching the Go specification and go/parser AST association."
representation = "The maintained grammar moves postfix precedence above operator precedence. This intentionally corrects the pinned Lezer CST when a postfix operation follows an operator expression; every affected reference fixture is counted explicitly."

[[override_item]]
rust_item = "rezel_go::go_highlighting"
classification = "adapted"
upstream_file = "src/highlight.js"
upstream_symbols = ["goHighlighting"]
invariant = "Go syntax nodes project the pinned language package's abstract syntactic highlight tags."
representation = "A feature-gated Rust NodePropSource replaces the JavaScript styleTags object; parsing without the feature binds an inert property source."
