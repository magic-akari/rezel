schema_version = 1

[component]
name = "rezel-php"
source_root = "languages/php/src"

[upstream]
repository = "https://github.com/lezer-parser/php"
commit = "af2a40d0f39ed8e4f1a835a4c1d74e39d70dbc26"

[[snapshot]]
source = "src/highlight.js"
path = "alignment/upstream/php/highlight.json"

[[snapshot]]
source = "src/tokens.js"
path = "alignment/upstream/php/tokens.json"

[[scope]]
rust_file = "generated.rs"
classification = "rezel-owned"
invariant = "The checked static parser is regenerated byte-for-byte from the maintained PHP 8.5 grammar and statically imports every declared external by its module and symbol name."
representation = "Rezel's Rust generator emits immutable LR tables from the pinned Lezer PHP grammar after the maintained PHP 8.5.9 syntax adjustments."
evidence_files = [
	"languages/php/src/php.grammar",
	"languages/php/tests/php85.rs",
	"languages/php/tests/php_src.rs",
	"languages/php/tests/upstream.rs",
	"tools/codegen/src/main.rs",
]

[[scope]]
rust_file = "highlighting.rs"
classification = "adapted"
upstream_file = "src/highlight.js"
upstream_symbols = ["phpHighlighting"]
invariant = "PHP CST nodes project the pinned language package's abstract syntactic highlight tags, extended only for maintained PHP 8.5 nodes."
representation = "A feature-gated Rust NodePropSource replaces the JavaScript styleTags object; parsing without the feature binds an inert property source."
evidence_files = ["languages/php/tests/highlighting.rs"]

[[scope]]
rust_file = "lib.rs"
classification = "rezel-owned"
invariant = "The PHP facade cheaply clones immutable generated language data, defaults to mixed PHP templates, and exposes an explicit tagless Program entry point."
representation = "A process-wide OnceLock owns the default parser while callers configure owned LRParser clones and select Template or Program without duplicating parser tables."
evidence_files = [
	"languages/php/tests/contract.rs",
	"languages/php/tests/php85.rs",
]

[[scope]]
rust_file = "terms.rs"
classification = "rezel-owned"
invariant = "Named PHP grammar terms have deterministic identifiers shared by generated tables and external callbacks."
representation = "Rezel's Rust generator emits constants directly from the maintained PHP grammar."
evidence_files = ["tools/codegen/src/main.rs"]

[[scope]]
rust_file = "tokens.rs"
classification = "adapted"
upstream_file = "src/tokens.js"
upstream_symbols = [
	"castTypes",
	"eofToken",
	"expression",
	"interpolated",
	"isASCIILetter",
	"isHex",
	"isIdentifierStart",
	"isSpace",
	"keywordMap",
	"keywords",
	"scanEscape",
	"semicolon",
]
invariant = "Keywords, casts, heredoc and nowdoc bodies, interpolated strings, close-tag semicolons, and EOF preserve the pinned scanner behavior while accepting the maintained PHP 8.5 lexical additions."
representation = "Typed Rust callbacks replace JavaScript token objects; start-code-point filters avoid irrelevant calls, sequential scans remain linear, contextual keyword specialization preserves semi-reserved identifiers, and small fixed scanners add PHP 8.5 pipeline, asymmetric-set visibility, quoted heredoc, and exact open-tag boundaries."
evidence_files = [
	"languages/php/tests/contract.rs",
	"languages/php/tests/php85.rs",
	"languages/php/tests/php_src.rs",
	"languages/php/tests/tokens.rs",
	"languages/php/tests/upstream.rs",
]

[[scope]]
rust_file = "typed.rs"
classification = "rezel-owned"
invariant = "Generated typed syntax preserves PHP CST node identity and exposes lazy direct-child views for the declared partial schema."
representation = "Checked Rust wrappers implement Rezel's TypedNode API from the declarative PHP typed schema without constructing an owned AST."
evidence_files = [
	"languages/php/src/php.typed.toml",
	"languages/php/tests/typed.rs",
	"tools/codegen/src/main.rs",
]
