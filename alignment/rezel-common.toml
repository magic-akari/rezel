schema_version = 1

[component]
name = "rezel-common"
source_root = "crates/rezel-common/src"

[upstream]
repository = "https://github.com/lezer-parser/common"
commit = "de5f96276a2954c249de1475e8b03f79c20d9ce4"

[[snapshot]]
source = "src/tree.ts"
path = "alignment/upstream/common/tree.json"

[[snapshot]]
source = "src/parse.ts"
path = "alignment/upstream/common/parse.json"

[[snapshot]]
source = "src/mix.ts"
path = "alignment/upstream/common/mix.json"

[[scope]]
rust_file = "lib.rs"
classification = "rezel-owned"
invariant = "The crate root exposes the supported common syntax-tree API as one coherent downstream-facing facade."
representation = "Rust crate and module packaging is Rezel-owned; provenance for the re-exported API is recorded against the files that define it."

[[scope]]
rust_file = "prop.rs"
classification = "adapted"
upstream_file = "src/tree.ts"
upstream_symbols = ["NodeProp", "NodePropSource", "NodeType.match"]
invariant = "Property keys distinguish per-type and per-node storage and derive immutable node-type metadata."
representation = "Rust uses typed process-local keys and Arc<dyn Any> values instead of JavaScript object properties."
evidence_files = ["crates/rezel-common/tests/tree.rs"]

[[scope]]
rust_file = "tree.rs"
classification = "adapted"
upstream_file = "src/tree.ts"
upstream_symbols = [
	"DefaultBufferLength",
	"Range",
	"NodeType",
	"NodeSet",
	"MountedTree",
	"IterMode",
	"Tree",
	"TreeBuffer",
	"BufferCursor",
	"FlatBufferCursor",
	"SyntaxNode",
	"TreeCursor",
	"buildTree",
	"balanceRange",
]
invariant = "Compact immutable trees preserve named-node traversal, boundary resolution, packed-buffer, property, mount, and balancing semantics."
representation = "Rust represents each TreeBuffer with one shared Arc handle, stores packed u16 quads, uses TextSize and TextRange coordinates and typed flags, and builds trees from a cloneable backward postfix cursor without flattening the producer; incremental reuse is excluded."
evidence_files = ["crates/rezel-common/tests/tree.rs"]

[[scope]]
rust_file = "parse.rs"
classification = "adapted"
upstream_file = "src/parse.ts"
upstream_symbols = [
	"Input",
	"Input.chunk",
	"StringInput",
	"StringInput.chunk",
	"PartialParse",
	"Parser",
	"ParseWrapper",
]
invariant = "A parser creates a resumable parse over immutable input, and full parsing advances it to one completed tree."
representation = "Rust shares immutable UTF-8 input and bounded identity-chunk byte slices through Arc, projects language-specific logical UTF-16 units without changing public TextSize byte coordinates, reports setup and parse failures through Result, and keeps selected mixed-parser ranges inside ParseRequest."
evidence_files = ["crates/rezel-common/tests/input.rs"]

[[scope]]
rust_file = "mix.rs"
classification = "adapted"
upstream_file = "src/mix.ts"
upstream_symbols = ["NestedParse", "parseMixed", "MixedParse", "checkRanges", "punchRanges"]
invariant = "Mixed parsing completes the outer parse, parses selected nested ranges, and mounts replacement or overlay trees."
representation = "Incremental fragment and reuse paths are excluded, and packed targets are materialized before mounting."

[[scope]]
rust_file = "typed.rs"
classification = "rezel-owned"
invariant = "Typed wrappers preserve concrete language identity, retain the original node on failed downcasts, and lazily project direct children."
representation = "Rust traits and generic iterators add a zero-copy language-specific view over the source-aligned generic CST."
evidence_files = ["crates/rezel-common/tests/typed.rs"]

[[override_item]]
rust_item = "rezel_common::parse::ParseRequest::map_input"
classification = "rezel-owned"
invariant = "A language parser can replace an immutable input view once while preserving the caller's selected parse ranges."
representation = "A hidden Rust request transformer makes language-specific logical input composable through the common Parser trait."

[[override_item]]
rust_item = "rezel_common::parse::ParseError::new"
classification = "rezel-owned"
invariant = "Fatal parser contract failures retain their category, optional byte position, and message."
representation = "Rust Result requires an owned error type absent from the throwing JavaScript API."

[[override_item]]
rust_item = "rezel_common::parse::ParseError::kind"
classification = "rezel-owned"
invariant = "Fatal parser contract failures expose their stable category."
representation = "Rust Result requires an owned error type absent from the throwing JavaScript API."

[[override_item]]
rust_item = "rezel_common::parse::ParseError::position"
classification = "rezel-owned"
invariant = "Fatal parser contract failures expose their optional UTF-8 byte position."
representation = "Rust Result requires an owned error type absent from the throwing JavaScript API."

[[override_item]]
rust_item = "rezel_common::parse::ParseError::message"
classification = "rezel-owned"
invariant = "Fatal parser contract failures expose their diagnostic message."
representation = "Rust Result requires an owned error type absent from the throwing JavaScript API."

[[excluded]]
upstream_file = "src/parse.ts"
upstream_symbol = "ChangedRange"
reason = "Changed ranges only support incremental fragment reuse."

[[excluded]]
upstream_file = "src/parse.ts"
upstream_symbol = "TreeFragment"
reason = "Tree fragments and their change application methods are incremental-only."

[[excluded]]
upstream_file = "src/tree.ts"
upstream_symbol = "NodeWeakMap"
reason = "The weak map preserves metadata across reused incremental tree nodes."

[[excluded]]
upstream_file = "src/tree.ts"
upstream_symbol = "NodeProp.contextHash"
reason = "The per-node context hash validates incremental node reuse."

[[excluded]]
upstream_file = "src/tree.ts"
upstream_symbol = "NodeProp.lookAhead"
reason = "Look-ahead metadata invalidates incremental fragments."

[[excluded]]
upstream_file = "src/tree.ts"
upstream_symbol = "BuildData.reused"
reason = "Reused-node records refer to cross-parse tree fragments."

[[excluded]]
upstream_file = "src/mix.ts"
upstream_symbol = "FragmentCursor"
reason = "Fragment cursors recover mounted trees from incremental fragments."

[[excluded]]
upstream_file = "src/mix.ts"
upstream_symbol = "StructureCursor"
reason = "StructureCursor searches reusable nodes inside fragments."

[[excluded]]
upstream_file = "src/mix.ts"
upstream_symbol = "enterFragments"
reason = "Entering old mounted fragments is an incremental reuse optimization."

[[excluded]]
upstream_file = "src/mix.ts"
upstream_symbol = "findCoverChanges"
reason = "Cover-change calculation only splits reusable incremental fragments."
