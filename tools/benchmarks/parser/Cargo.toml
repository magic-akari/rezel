[package]
name = "rezel-parser-benchmark"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]
resolver = "3"

[dependencies]
rezel-lang-go = { path = "../../../languages/go" }
rezel-lang-java = { path = "../../../languages/java" }
rezel-lang-json = { path = "../../../languages/json" }
rezel-lang-kotlin = { path = "../../../languages/kotlin" }
rezel-lang-python = { path = "../../../languages/python" }
rezel-lang-rust = { path = "../../../languages/rust" }
rezel-lang-swift = { path = "../../../languages/swift" }
rezel-lr = { path = "../../../crates/rezel-lr" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
toml = "=1.1.2"
tree-sitter = "=0.26.11"
tree-sitter-go = "=0.25.0"
tree-sitter-java = "=0.23.5"
tree-sitter-json = "=0.24.8"
tree-sitter-kotlin = { package = "tree-sitter-kotlin-ng", version = "=1.1.0" }
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-swift = "=0.7.3"

[dev-dependencies]
gungraun = "=0.19.4"

[[bench]]
harness = false
name = "gungraun"
test = false

[profile.release]
codegen-units = 1
lto = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
