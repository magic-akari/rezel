language = "RustLanguage"
kind = "RustKind"
language_path = "crate::generated::LANGUAGE"
coverage = "complete"
ignore = [
	"⚠",
	"!",
	"&",
	"(",
	")",
	",",
	"->",
	"...",
	":",
	"::",
	";",
	"<",
	"=",
	"=>",
	">",
	"[",
	"]",
	"{",
	"|",
	"}",
	"abstract",
	"as",
	"async",
	"auto",
	"await",
	"become",
	"box",
	"break",
	"const",
	"continue",
	"default",
	"do",
	"dyn",
	"else",
	"enum",
	"extern",
	"final",
	"fn",
	"for",
	"gen",
	"if",
	"impl",
	"in",
	"let",
	"loop",
	"macro",
	"macro_rules",
	"match",
	"mod",
	"move",
	"mut",
	"override",
	"priv",
	"pub",
	"raw",
	"ref",
	"return",
	"safe",
	"static",
	"struct",
	"trait",
	"try",
	"type",
	"typeof",
	"union",
	"unsafe",
	"unsized",
	"use",
	"virtual",
	"where",
	"while",
	"yield",
]

[kind_names]
"⚠" = "Error"
"!" = "Bang"
"&" = "Ampersand"
"(" = "LeftParen"
")" = "RightParen"
"," = "Comma"
"->" = "ThinArrow"
".." = "DotDot"
"..." = "DotDotDot"
":" = "Colon"
"::" = "PathSeparator"
";" = "Semicolon"
"<" = "LeftAngle"
"=" = "Equals"
"=>" = "FatArrow"
">" = "RightAngle"
"[" = "LeftBracket"
"]" = "RightBracket"
"{" = "LeftBrace"
"|" = "Pipe"
"}" = "RightBrace"
"_" = "Underscore"
"self" = "SelfKeyword"
"macro_rules" = "MacroRules"

